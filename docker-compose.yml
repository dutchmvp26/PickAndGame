services:

  database:
    image: postgres:16

    environment:
      POSTGRES_DB: png
      POSTGRES_USER: png_user
      POSTGRES_PASSWORD: png_password

    ports:
      - "5432:5432"

    volumes:
      - png-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d png" ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/png
      SPRING_DATASOURCE_USERNAME: png_user
      SPRING_DATASOURCE_PASSWORD: png_password
    depends_on:
      - database

volumes:
  png-postgres-data: