spring.application.name=png-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/png
spring.datasource.username=png_user
spring.datasource.password=png_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Send error messages (e.g. "Room is full.") and validation errors
# back to the frontend instead of hiding them
server.error.include-message=always
server.error.include-binding-errors=always
